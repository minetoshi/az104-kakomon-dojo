name: Check Microsoft Learn links

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

# Several back-to-back pushes can trigger Microsoft Learn HTTP 429 responses.
# Run once a week, or explicitly on demand after changing source URLs.
concurrency:
  group: az104-learn-links
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check official Learn links
        run: node scripts/check-learn-links.mjs
      - name: Upload Learn link health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az104-learn-links-health
          path: reports/learn-links.json
          if-no-files-found: warn
          retention-days: 90
