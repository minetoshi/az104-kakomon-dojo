name: Check Microsoft Learn links

on:
  push:
    branches: [main]
    paths:
      - "questions/**"
      - "learn-map.js"
      - "audit-map.js"
      - "glossary.js"
      - "learn-summary.js"
      - "scripts/check-learn-links.mjs"
      - ".github/workflows/check-learn-links.yml"
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check official Learn links
        run: node scripts/check-learn-links.mjs
