name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Learn URL monitor syntax
        run: node --check scripts/check-learn-links.mjs

      - name: Validate question data and UI invariants
        run: node scripts/validate-data.js

      - name: Syntax-check quality triage script
        run: node --check scripts/generate-quality-queue.js

      - name: Generate risk-prioritized semantic QA backlog
        run: node scripts/generate-quality-queue.js

      - name: Upload QA backlog report
        uses: actions/upload-artifact@v4
        with:
          name: az104-semantic-qa-backlog
          path: |
            reports/semantic-audit-queue.json
            reports/semantic-audit-queue.md
          retention-days: 90

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
